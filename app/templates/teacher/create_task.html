{% extends "base.html" %}
{% block content %}
<div class="form-card">
  <h2>Новое домашнее задание</h2>

  <form method="POST" enctype="multipart/form-data" class="task-form">
    <div class="input-group">
      <label>Предмет</label>
      <select name="subject_id" id="subjectSelect" required>
        {% for s in subjects %}<option value="{{ s.id }}">{{ s.name }}</option>{% endfor %}
      </select>
    </div>

    <div class="input-group">
      <label>Название задания</label>
      <input type="text" name="title" required placeholder="Например: §5, задачи 1–10">
    </div>

    <div class="row">
      <div class="input-group">
        <label>Группа</label>
        <select name="group_name" id="groupSelect" required>
          <option value="">Выберите группу</option>
        </select>
      </div>
      <div class="input-group">
        <label>Срок сдачи</label>
        <input type="date" name="due_date" required>
      </div>
    </div>

    <div class="row">
      <div class="input-group">
        <label>Прикрепить файл</label>
        <input type="file" name="file">
      </div>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Сохранить</button>
      <a href="{{ url_for('teacher.dashboard') }}" class="btn btn-secondary">Отмена</a>
    </div>
  </form>
</div>

<script>
  const subjectGroups = {{ subject_groups | tojson }};
  const subjectSelect = document.getElementById('subjectSelect');
  const groupSelect = document.getElementById('groupSelect');

  function updateGroups() {
    const subjId = subjectSelect.value;
    groupSelect.innerHTML = '';
    if (subjectGroups[subjId] && subjectGroups[subjId].length > 0) {
      subjectGroups[subjId].forEach(g => {
        const opt = document.createElement('option');
        opt.value = g; opt.textContent = g; groupSelect.appendChild(opt);
      });
    } else {
      groupSelect.innerHTML = '<option value="">Нет групп</option>';
    }
  }
  subjectSelect.addEventListener('change', updateGroups);
  updateGroups();
</script>
{% endblock %}

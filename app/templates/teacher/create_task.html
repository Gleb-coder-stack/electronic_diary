{% extends "base.html" %}
{% block content %}
<div class="form-card">
  <h2>Новое домашнее задание</h2>
  <form method="POST">
    <div class="input-group">
      <label>Предмет</label>
      <select name="subject_id" required>
        {% for s in subjects %}
          <option value="{{ s.id }}">{{ s.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="input-group">
      <label>Название задания</label>
      <input type="text" name="title" required placeholder="Например: §5, задачи 1–10">
    </div>
    <div class="input-group">
      <label>Описание</label>
      <textarea name="description" rows="4" placeholder="Подробное описание задания"></textarea>
    </div>
    <div class="row">
      <div class="input-group">
        <label>Группа</label>
        <input type="text" name="group_name" required placeholder="ИС-21">
      </div>
      <div class="input-group">
        <label>Срок сдачи</label>
        <input type="date" name="due_date" required>
      </div>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Сохранить</button>
      <a href="{{ url_for('teacher.dashboard') }}" class="btn btn-secondary">Отмена</a>
    </div>
  </form>
</div>
{% endblock %}
